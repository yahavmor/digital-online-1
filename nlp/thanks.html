<style>
:root{--ink:#14161B;--ink2:#3A3E47;--muted:#6B707B;--line:#E7E3DA;--gold:#A8823F;--gold2:#C9A96E;--ok:#1F7A4D}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:18px 16px 48px;text-align:center}
.brand{display:flex;justify-content:center;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--ink2);padding:4px 0 14px;border-bottom:1px solid var(--line)}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--gold2)}
.ok{width:72px;height:72px;border-radius:50%;margin:34px auto 14px;display:grid;place-items:center;background:#EEF7F1;color:var(--ok);font-size:36px;font-weight:900}

.lead{font-size:18px;color:var(--ink2);margin:0 0 4px}
.sent{font-size:16px;color:var(--ink2);margin:0 0 24px}
.cta{display:flex;justify-content:center;align-items:center;min-height:56px;border-radius:14px;background:linear-gradient(180deg,#D9BE85,#C9A96E);color:#14161B;font-weight:800;font-size:19px;text-decoration:none;box-shadow:0 8px 24px rgba(168,130,63,.28)}
.note{font-size:14px;color:var(--muted);margin:16px 0 0}
.help{font-size:14px;margin:10px 0 0}
.help a{color:var(--ink2)}
