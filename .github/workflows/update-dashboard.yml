name: Update god_manager dashboard

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r meta_ads_automation/requirements.txt

      - name: Generate god_manager.html
        working-directory: meta_ads_automation
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          # Retry transient API errors before failing the run.
          for i in 1 2 3; do
            python dashboard.py && exit 0
            echo "Dashboard generation failed (attempt $i), retrying in 30s..."
            sleep 30
          done
          exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "god_manager-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meta_ads_automation/god_manager.html
          if git diff --cached --quiet; then
            echo "No changes to the dashboard, skipping commit."
            exit 0
          fi
          git commit -m "Auto-update god_manager dashboard"
          # Several dashboard workflows push to main on the same schedule.
          # Rebase on the latest main and retry instead of failing on a race.
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push failed (attempt $i), retrying..."
            sleep $((i * 7))
          done
          exit 1
